<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CT-GenAI v1.1 — Ôn tập kiến thức theo chương. 5 chương, Prompt Engineering, Rủi ro, LLM Infrastructure, Triển khai.">
  <title>CT-GenAI — Ôn Tập Kiến Thức</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:          #0F172A;
      --surface:     #1E293B;
      --surface-2:   #334155;
      --surface-3:   #475569;
      --primary:     #6366F1;
      --primary-h:   #4F46E5;
      --text:        #F1F5F9;
      --muted:       #94A3B8;
      --accent:      #F59E0B;
      --success:     #10B981;
      --border:      rgba(148,163,184,.12);
      --border-med:  rgba(148,163,184,.2);
      --sidebar-w:   272px;
      --header-h:    56px;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar       { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--surface-3); }
    *:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    #progress-bar {
      position: fixed; top: 0; left: 0; height: 3px; width: 0%;
      background: linear-gradient(90deg, var(--primary), #A78BFA);
      z-index: 200; transition: width .1s linear;
    }

    /* ── Header ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
      background: rgba(15,23,42,.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
      z-index: 100;
    }
    .header-back {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--muted); cursor: pointer;
      font-size: 13px; font-weight: 600; font-family: inherit;
      transition: color .15s, border-color .15s; text-decoration: none; white-space: nowrap;
    }
    .header-back:hover { color: var(--text); border-color: var(--border-med); }
    .header-logo {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      display: flex; align-items: center; justify-content: center;
    }
    .header-title { font-size: 14px; font-weight: 800; color: var(--text); }
    .header-sub   { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .header-spacer { flex: 1; }
    #current-chapter-label { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

    #btn-sidebar-toggle {
      display: none; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      cursor: pointer; color: var(--muted); flex-shrink: 0;
    }
    #btn-sidebar-toggle svg { width: 16px; height: 16px; }
    #btn-sidebar-toggle:hover { color: var(--text); background: var(--surface-2); }

    /* ── Sidebar ── */
    #sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
      z-index: 49; opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    #sidebar-overlay.open { opacity: 1; display: block; }

    .sidebar {
      position: fixed; top: var(--header-h); left: 0; bottom: 0;
      width: var(--sidebar-w); background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden; z-index: 50;
    }
    .sidebar-section { padding: 16px 12px 8px; }
    .sidebar-section-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .1em; margin-bottom: 8px; padding: 0 4px; }

    .ch-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 8px; border-radius: 10px; border: none;
      background: none; cursor: pointer; text-align: left; width: 100%;
      font-family: inherit; transition: background .15s; margin-bottom: 2px;
    }
    .ch-item:hover  { background: var(--surface-2); }
    .ch-item.active { background: rgba(99,102,241,.12); }

    .ch-dot {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800;
    }
    .ch-info { flex: 1; min-width: 0; }
    .ch-num  { font-size: 9px; font-weight: 700; letter-spacing: .08em; }
    .ch-title-short { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ch-meta { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
    .ch-badge { font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
    .ch-badge.weight { background: rgba(245,158,11,.12); color: #F59E0B; }
    .ch-read-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex-shrink: 0; }

    .sidebar-divider { height: 1px; background: var(--border); margin: 4px 12px; }

    /* TOC */
    #toc-section { flex: 1; overflow-y: auto; padding-bottom: 16px; }
    .toc-list { list-style: none; }
    .toc-item {
      display: block; width: 100%; text-align: left;
      padding: 5px 8px; border-radius: 6px; border: none;
      background: none; color: var(--muted); font-size: 12px;
      cursor: pointer; font-family: inherit; line-height: 1.4;
      transition: color .12s, background .12s; margin-bottom: 1px;
    }
    .toc-item.h3 { padding-left: 20px; font-size: 11px; }
    .toc-item:hover { color: var(--text); background: var(--surface-2); }
    .toc-item.active { color: var(--primary); background: rgba(99,102,241,.1); }

    /* ── Main ── */
    .app-layout { margin-top: var(--header-h); margin-left: var(--sidebar-w); min-height: calc(100vh - var(--header-h)); }
    .main-content { max-width: calc(var(--sidebar-w) + 860px); padding: 40px 48px 80px; position: relative; }
    .main-content::before {
      content: ''; position: absolute; top: -30px; right: -30px;
      width: 300px; height: 300px; border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Chapter banner ── */
    .ch-banner {
      border-radius: 16px; padding: 24px 28px; margin-bottom: 32px;
      position: relative; overflow: hidden;
    }
    .ch-banner::before {
      content: ''; position: absolute; top: -40px; right: -40px;
      width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.06);
    }
    .ch-banner::after {
      content: ''; position: absolute; bottom: -60px; right: 60px;
      width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.04);
    }

    /* ── Markdown ── */
    .md-body { line-height: 1.75; font-size: 15px; }
    .md-body h1 { font-size: 26px; font-weight: 800; margin: 0 0 24px; color: var(--text); }
    .md-body h2 { font-size: 20px; font-weight: 700; margin: 40px 0 16px; color: var(--text); padding-top: 8px; border-top: 1px solid var(--border); }
    .md-body h3 { font-size: 16px; font-weight: 700; margin: 28px 0 12px; color: var(--text); }
    .md-body h3::before { content: ''; display: inline-block; width: 4px; height: 16px; border-radius: 2px; background: var(--primary); margin-right: 10px; vertical-align: middle; }
    .md-body h4 { font-size: 14px; font-weight: 700; margin: 20px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .md-body p  { margin: 0 0 14px; color: var(--text); }
    .md-body strong { color: var(--text); font-weight: 700; }
    .md-body em { color: #7DD3FC; font-style: italic; }
    .md-body a  { color: var(--primary); text-decoration: none; }
    .md-body a:hover { text-decoration: underline; }
    .md-body blockquote { border-left: 3px solid var(--primary); margin: 16px 0; padding: 12px 16px; background: rgba(99,102,241,.07); border-radius: 0 8px 8px 0; }
    .md-body blockquote p { margin: 0; color: var(--muted); font-size: 14px; }
    .md-body table { width: 100%; border-collapse: collapse; margin: 16px 0 24px; font-size: 14px; }
    .md-body th { background: var(--surface-2); padding: 10px 14px; text-align: left; font-weight: 700; color: var(--text); border-bottom: 2px solid var(--border-med); }
    .md-body td { padding: 9px 14px; border-bottom: 1px solid var(--border); color: var(--muted); vertical-align: top; }
    .md-body tr:last-child td { border-bottom: none; }
    .md-body tr:hover td { background: rgba(148,163,184,.04); }
    .md-body code { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace; color: #A78BFA; }
    .md-body pre  { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin: 16px 0; overflow-x: auto; }
    .md-body pre code { background: none; padding: 0; color: var(--text); font-size: 13px; }
    .md-body ul, .md-body ol { margin: 8px 0 14px 20px; }
    .md-body li { margin-bottom: 6px; color: var(--muted); }
    .md-body li strong { color: var(--text); }
    .md-body hr  { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
    .md-body input[type="checkbox"] { margin-right: 6px; accent-color: var(--primary); }

    /* Loading */
    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 80px 20px; text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--surface-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }

    /* Scroll-to-top */
    #btn-top {
      position: fixed; bottom: 24px; right: 24px;
      width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .2s, color .15s;
    }
    #btn-top.visible { opacity: 1; pointer-events: all; }
    #btn-top svg { width: 16px; height: 16px; }
    #btn-top:hover { color: var(--text); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      #btn-sidebar-toggle { display: flex; }
      .sidebar { transform: translateX(-100%); transition: transform .25s; box-shadow: none; }
      .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.5); }
      #sidebar-overlay { display: block; }
      .app-layout { margin-left: 0; }
      .main-content { padding: 24px 16px 60px; }
      #current-chapter-label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

  <header>
    <a class="header-back" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Trở về
    </a>
    <div class="header-logo" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 0 1 9 9c0 3.18-1.65 5.97-4.13 7.59L17 21H7l.13-2.41A9 9 0 0 1 3 11a9 9 0 0 1 9-9z"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="12" y2="14"/></svg>
    </div>
    <div>
      <div class="header-title">CT-GenAI v1.1</div>
      <div class="header-sub">Ôn tập kiến thức</div>
    </div>
    <div class="header-spacer"></div>
    <span id="current-chapter-label" aria-live="polite"></span>
    <button id="btn-sidebar-toggle" onclick="toggleSidebar()" aria-label="Mở/đóng danh sách chương">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </header>

  <div id="sidebar-overlay" onclick="closeSidebar()" aria-hidden="true"></div>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Danh sách chương">
      <div class="sidebar-section">
        <div class="sidebar-section-label">CÁC CHƯƠNG</div>
        <nav id="chapter-nav" aria-label="Chương ôn tập"></nav>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section" id="toc-section" style="flex:1;overflow-y:auto;">
        <div class="sidebar-section-label">MỤC LỤC</div>
        <nav id="toc-nav" aria-label="Mục lục chương hiện tại">
          <ul class="toc-list" id="toc-list"></ul>
        </nav>
      </div>
    </aside>

    <main class="main-content" id="main-content" role="main">
      <div class="content-inner">
        <div class="ch-banner" id="ch-banner"></div>
        <article class="md-body" id="md-body">
          <div class="loading-state">
            <div class="spinner"></div>
            <p style="color:var(--muted);font-size:14px;">Đang tải nội dung...</p>
          </div>
        </article>
      </div>
    </main>
  </div>

  <button id="btn-top" onclick="scrollToTop()" aria-label="Cuộn lên đầu trang">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <script>
  (function () {
    'use strict';

    const CHAPTERS = [
      { id: 1, titleVi: 'Giới thiệu GenAI',        titleEn: 'Introduction to GenAI',         time: 100, weight: '~15%', color: '#6366F1', file: 'GenAI-OnTapKienThuc/Chuong-01-Gioi-Thieu-GenAI.md' },
      { id: 2, titleVi: 'Prompt Engineering',       titleEn: 'Prompt Engineering for Testing', time: 365, weight: '~40%', color: '#8B5CF6', file: 'GenAI-OnTapKienThuc/Chuong-02-Prompt-Engineering.md' },
      { id: 3, titleVi: 'Quản lý Rủi ro GenAI',    titleEn: 'Managing Risks of GenAI',        time: 160, weight: '~25%', color: '#EC4899', file: 'GenAI-OnTapKienThuc/Chuong-03-Quan-Ly-Rui-Ro.md' },
      { id: 4, titleVi: 'Cơ sở hạ tầng LLM',       titleEn: 'LLM Infrastructure',             time: 110, weight: '~12%', color: '#06B6D4', file: 'GenAI-OnTapKienThuc/Chuong-04-Co-So-Ha-Tang-LLM.md' },
      { id: 5, titleVi: 'Triển khai GenAI',         titleEn: 'Deploying GenAI for Testing',    time: 80,  weight: '~8%',  color: '#10B981', file: 'GenAI-OnTapKienThuc/Chuong-05-Trien-Khai-GenAI.md' },
    ];

    const STORAGE_KEY = 'genai_review_read';
    let activeId = 1;
    let readSet  = new Set();
    let tocObserver = null;

    function loadRead() {
      try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
      catch { return new Set(); }
    }
    function saveRead() { localStorage.setItem(STORAGE_KEY, JSON.stringify([...readSet])); }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebar-overlay');
      const open = sb.classList.toggle('open');
      ov.classList.toggle('open', open);
      ov.style.pointerEvents = open ? 'all' : 'none';
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      const ov = document.getElementById('sidebar-overlay');
      ov.classList.remove('open');
      ov.style.pointerEvents = 'none';
    }
    window.toggleSidebar = toggleSidebar;
    window.closeSidebar  = closeSidebar;

    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    window.scrollToTop = scrollToTop;

    function buildChapterNav() {
      const nav = document.getElementById('chapter-nav');
      nav.innerHTML = '';
      CHAPTERS.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'ch-item' + (ch.id === activeId ? ' active' : '');
        btn.setAttribute('aria-current', ch.id === activeId ? 'page' : 'false');
        btn.onclick = () => { loadChapter(ch.id); closeSidebar(); };
        const isRead = readSet.has(ch.id);
        btn.innerHTML = `
          <div class="ch-dot" style="background:${ch.color}22;border:1.5px solid ${ch.color}44;color:${ch.color};">${ch.id}</div>
          <div class="ch-info">
            <div class="ch-num" style="color:${ch.color};">CHƯƠNG ${ch.id}</div>
            <div class="ch-title-short">${ch.titleVi}</div>
            <div class="ch-meta">
              <span class="ch-badge">${ch.time} phút</span>
              <span class="ch-badge weight">${ch.weight}</span>
            </div>
          </div>
          ${isRead ? '<div class="ch-read-dot" title="Đã đọc"></div>' : ''}
        `;
        nav.appendChild(btn);
      });
    }

    function buildBanner(ch) {
      const banner = document.getElementById('ch-banner');
      banner.style.background = `linear-gradient(135deg, ${ch.color}dd 0%, ${ch.color}99 100%)`;
      banner.innerHTML = `
        <div style="position:relative;z-index:1;">
          <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.75);letter-spacing:.1em;margin-bottom:6px;">
            CT-GenAI v1.1 · CHƯƠNG ${ch.id}
          </div>
          <div style="font-size:22px;font-weight:800;color:white;margin-bottom:4px;">${ch.titleVi}</div>
          <div style="font-size:13px;color:rgba(255,255,255,.75);margin-bottom:14px;">${ch.titleEn}</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <span style="background:rgba(255,255,255,.18);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;color:white;">${ch.time} phút</span>
            <span style="background:rgba(255,255,255,.18);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;color:white;">${ch.weight} đề thi</span>
          </div>
        </div>
      `;
    }

    function slugify(text) {
      return text.toLowerCase()
        .replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g, 'a')
        .replace(/[èéẹẻẽêềếệểễ]/g, 'e')
        .replace(/[ìíịỉĩ]/g, 'i')
        .replace(/[òóọỏõôồốộổỗơờớợởỡ]/g, 'o')
        .replace(/[ùúụủũưừứựửữ]/g, 'u')
        .replace(/[ỳýỵỷỹ]/g, 'y')
        .replace(/đ/g, 'd')
        .replace(/[^a-z0-9\s-]/g, '')
        .trim().replace(/\s+/g, '-').replace(/-+/g, '-');
    }

    function buildTOC() {
      const body    = document.getElementById('md-body');
      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = '';
      const headings = body.querySelectorAll('h2, h3');
      const items    = [];
      headings.forEach((el, idx) => {
        if (el.textContent.trim().toLowerCase() === 'mục lục') {
          el.style.display = 'none';
          if (el.nextElementSibling && el.nextElementSibling.tagName === 'OL') el.nextElementSibling.style.display = 'none';
          return;
        }
        const id = 'heading-' + idx + '-' + slugify(el.textContent.replace(/[⭐★✓✗]/g, '').trim());
        el.id = id;
        const btn = document.createElement('button');
        btn.className = 'toc-item' + (el.tagName === 'H3' ? ' h3' : '');
        btn.textContent = el.textContent.replace(/^#+\s*/, '').trim();
        btn.dataset.target = id;
        btn.onclick = () => { scrollToHeading(id); closeSidebar(); };
        tocList.appendChild(btn);
        items.push({ id, el: btn });
      });
      setupTocObserver(headings, items);
    }

    function scrollToHeading(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function setupTocObserver(headings, tocItems) {
      if (tocObserver) tocObserver.disconnect();
      tocObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.id;
            tocItems.forEach(t => {
              t.el.classList.toggle('active', t.id === id);
              if (t.id === id) t.el.scrollIntoView({ block: 'nearest' });
            });
          }
        });
      }, { rootMargin: '-60px 0px -60% 0px', threshold: 0 });
      headings.forEach(h => { if (h.id) tocObserver.observe(h); });
    }

    function setupProgressBar() {
      const bar = document.getElementById('progress-bar');
      function update() {
        const scrollTop = window.scrollY;
        const docH = document.documentElement.scrollHeight - window.innerHeight;
        const pct  = docH > 0 ? Math.round(scrollTop / docH * 100) : 0;
        bar.style.width = pct + '%';
        bar.setAttribute('aria-valuenow', pct);
        if (pct >= 92 && !readSet.has(activeId)) {
          readSet.add(activeId);
          saveRead();
          buildChapterNav();
        }
        const btn = document.getElementById('btn-top');
        if (scrollTop > 400) btn.classList.add('visible');
        else btn.classList.remove('visible');
      }
      window.addEventListener('scroll', update, { passive: true });
      update();
    }

    async function loadChapter(id) {
      const ch = CHAPTERS.find(c => c.id === id);
      if (!ch) return;
      activeId = id;
      document.getElementById('current-chapter-label').textContent = `Ch.${id} — ${ch.titleVi}`;
      document.title = `Ch.${id} ${ch.titleVi} — CT-GenAI Ôn Tập`;

      const mdBody = document.getElementById('md-body');
      mdBody.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';

      try {
        const res  = await fetch(ch.file);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        requestAnimationFrame(() => {
          const html = marked.parse(text, { gfm: true, breaks: false });
          mdBody.innerHTML = html;
          buildBanner(ch);
          buildChapterNav();
          buildTOC();
          window.scrollTo({ top: 0, behavior: 'instant' });
        });
      } catch (err) {
        mdBody.innerHTML = `<div class="loading-state"><p style="color:var(--accent);">Không thể tải chương ${id}.<br><small>${err.message}</small></p></div>`;
      }
    }

    function init() {
      readSet = loadRead();
      const params  = new URLSearchParams(window.location.search);
      const chParam = parseInt(params.get('ch'), 10);
      if (chParam >= 1 && chParam <= 5) activeId = chParam;
      buildChapterNav();
      loadChapter(activeId);
      setupProgressBar();
    }

    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
</body>
</html>
