<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ISTQB CT-GenAI v1.1 — Trang web học tập và luyện thi chứng chỉ Testing with Generative AI. 5 chương, 32 câu hỏi, flashcard từ khóa.">
  <title>CT-GenAI v1.1 — Ôn luyện thi</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://unpkg.com">

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (JSX transform) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:         #0F172A;
      --surface:    #1E293B;
      --surface-2:  #334155;
      --primary:    #6366F1;
      --primary-hover: #4F46E5;
      --text:       #F1F5F9;
      --muted:      #94A3B8;
      --accent:     #F59E0B;
      --success:    #10B981;
      --border:     rgba(148, 163, 184, 0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 15% 20%, rgba(99,102,241,.07) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(139,92,246,.05) 0%, transparent 50%);
      min-height: 100vh;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    #root { min-height: 100vh; }

    ::-webkit-scrollbar       { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    *:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    button { font-family: inherit; transition: all .15s; }
    button:hover { opacity: .92; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--surface-2);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .card-hover {
      transition: transform .2s, box-shadow .2s;
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:#0F172A;">
      <div class="spinner"></div>
      <p style="color:#94A3B8;font-size:14px;">Đang tải ứng dụng CT-GenAI...</p>
    </div>
  </div>

  <script src="genai-data.js"></script>
  <script type="text/babel" src="GenAIApplication.js"></script>
</body>
</html>
