<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CTFL v4.0.1 — Ôn tập kiến thức theo chương. Nền tảng kiểm thử, SDLC, Static Testing, Kỹ thuật kiểm thử, Quản lý, Công cụ.">
  <title>CTFL — Ôn Tập Kiến Thức</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- marked.js for Markdown → HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:          #0F172A;
      --surface:     #1E293B;
      --surface-2:   #334155;
      --surface-3:   #475569;
      --primary:     #0D9488;
      --primary-h:   #0F766E;
      --text:        #F1F5F9;
      --muted:       #94A3B8;
      --accent:      #F59E0B;
      --success:     #10B981;
      --border:      rgba(148,163,184,.12);
      --border-med:  rgba(148,163,184,.2);
      --sidebar-w:   272px;
      --header-h:    56px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar       { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--surface-3); }

    /* ── Focus ── */
    *:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* ── Reading progress bar ── */
    #progress-bar {
      position: fixed; top: 0; left: 0; height: 3px; width: 0%;
      background: linear-gradient(90deg, var(--primary), #2DD4BF);
      z-index: 200; transition: width .1s linear;
    }

    /* ── Header ── */
    header {
      position: fixed; top: 3px; left: 0; right: 0; height: var(--header-h);
      background: rgba(15,23,42,.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
      z-index: 100;
    }

    #btn-back {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px;
      color: var(--muted); font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: color .15s, background .15s;
      white-space: nowrap; flex-shrink: 0;
    }
    #btn-back:hover { color: var(--text); background: var(--surface-2); }
    #btn-back svg { width: 14px; height: 14px; }

    .header-title {
      font-size: 13px; font-weight: 700; color: var(--primary); letter-spacing: .06em;
    }
    .header-sub { font-size: 11px; color: var(--muted); font-weight: 500; }

    #btn-sidebar-toggle {
      display: none; align-items: center; justify-content: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px; cursor: pointer; color: var(--muted);
      font-family: inherit; margin-left: auto; flex-shrink: 0;
      transition: color .15s, background .15s;
    }
    #btn-sidebar-toggle:hover { color: var(--text); background: var(--surface-2); }
    #btn-sidebar-toggle svg { width: 16px; height: 16px; }

    .header-spacer { flex: 1; }

    #current-chapter-label {
      display: none; font-size: 12px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 160px; color: var(--text);
    }

    /* ── Layout ── */
    .app-layout {
      display: flex;
      padding-top: calc(var(--header-h) + 3px);
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed;
      top: calc(var(--header-h) + 3px);
      left: 0;
      width: var(--sidebar-w);
      height: calc(100vh - var(--header-h) - 3px);
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: rgba(15,23,42,.97);
      display: flex; flex-direction: column;
      z-index: 50;
      transition: transform .25s cubic-bezier(.4,0,.2,1);
    }

    .sidebar-section {
      padding: 16px 12px 8px;
    }
    .sidebar-section-label {
      font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--muted);
      padding: 0 4px; margin-bottom: 6px;
    }

    /* Chapter nav items */
    .ch-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 10px; border-radius: 10px; cursor: pointer;
      transition: background .15s; border: 1px solid transparent;
      font-family: inherit; background: none; width: 100%; text-align: left;
    }
    .ch-item:hover { background: var(--surface); }
    .ch-item.active {
      background: rgba(13,148,136,.12); border-color: rgba(13,148,136,.25);
    }

    .ch-dot {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; flex-shrink: 0; margin-top: 1px;
      transition: transform .15s;
    }
    .ch-item:hover .ch-dot { transform: scale(1.08); }

    .ch-info { flex: 1; min-width: 0; }
    .ch-num { font-size: 10px; font-weight: 700; letter-spacing: .06em; margin-bottom: 1px; }
    .ch-title-short { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.35; }
    .ch-meta { display: flex; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
    .ch-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 4px;
      background: var(--surface-2); color: var(--muted); font-weight: 600;
    }
    .ch-badge.weight { color: var(--accent); }

    .ch-read-mark {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      border: 1.5px solid var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      margin-top: 6px; transition: all .2s;
    }
    .ch-read-mark.done { background: var(--success); border-color: var(--success); }
    .ch-read-mark svg { width: 9px; height: 9px; color: white; }

    /* TOC in sidebar */
    .toc-list {
      padding: 0; list-style: none;
    }
    .toc-item {
      display: block; padding: 5px 10px; border-radius: 6px;
      font-size: 12px; color: var(--muted); text-decoration: none;
      transition: color .15s, background .15s;
      border-left: 2px solid transparent;
      line-height: 1.4;
      cursor: pointer; background: none; border-top: none; border-right: none; border-bottom: none;
      font-family: inherit; text-align: left; width: 100%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .toc-item:hover { color: var(--text); background: var(--surface); }
    .toc-item.active { color: var(--primary); border-left-color: var(--primary); background: rgba(13,148,136,.06); }
    .toc-item.h3 { padding-left: 20px; font-size: 11px; }

    .sidebar-divider {
      height: 1px; background: var(--border); margin: 8px 12px;
    }

    /* ── Main content ── */
    .main-content {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 40px 24px 80px;
      max-width: calc(var(--sidebar-w) + 860px);
      width: 100%;
    }

    .content-inner {
      max-width: 780px;
    }

    /* Chapter header banner */
    .ch-banner {
      border-radius: 16px; padding: 24px 28px; margin-bottom: 32px;
      position: relative; overflow: hidden;
    }
    .ch-banner::before {
      content: ''; position: absolute; top: -30px; right: -30px;
      width: 140px; height: 140px; border-radius: 50%;
      background: rgba(255,255,255,.05);
    }
    .ch-banner-num { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: rgba(255,255,255,.65); margin-bottom: 4px; }
    .ch-banner-title { font-size: 22px; font-weight: 800; color: white; line-height: 1.2; margin-bottom: 4px; }
    .ch-banner-sub { font-size: 14px; color: rgba(255,255,255,.75); margin-bottom: 16px; }
    .ch-banner-stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .ch-stat {
      background: rgba(255,255,255,.12); border-radius: 8px; padding: 6px 12px;
      font-size: 12px; font-weight: 700; color: rgba(255,255,255,.9);
    }
    .ch-stat span { font-size: 10px; font-weight: 500; color: rgba(255,255,255,.65); display: block; }

    /* ── Markdown rendered content ── */
    .md-body {
      font-size: 15px; line-height: 1.75; color: var(--text);
    }

    .md-body h1 {
      font-size: 24px; font-weight: 800; color: var(--text);
      margin: 0 0 24px; padding-bottom: 12px;
      border-bottom: 2px solid var(--primary);
      display: none; /* hidden — we show the banner instead */
    }

    .md-body h2 {
      font-size: 18px; font-weight: 700; color: var(--text);
      margin: 40px 0 16px; padding: 10px 16px;
      background: var(--surface); border-left: 3px solid var(--primary);
      border-radius: 0 8px 8px 0; scroll-margin-top: 80px;
    }

    .md-body h3 {
      font-size: 15px; font-weight: 700; color: var(--text);
      margin: 28px 0 12px; display: flex; align-items: center; gap: 8px;
      scroll-margin-top: 80px;
    }
    .md-body h3::before {
      content: ''; display: inline-block; width: 4px; height: 16px;
      background: var(--primary); border-radius: 2px; flex-shrink: 0;
    }

    .md-body h4 {
      font-size: 14px; font-weight: 700; color: var(--muted);
      margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .05em;
    }

    .md-body p {
      margin: 0 0 14px; color: #CBD5E1;
    }

    .md-body strong { color: var(--text); font-weight: 700; }

    .md-body em { color: #7DD3FC; font-style: italic; }

    .md-body a { color: var(--primary); text-decoration: none; }
    .md-body a:hover { text-decoration: underline; }

    /* Tables */
    .md-body table {
      width: 100%; border-collapse: collapse; margin: 16px 0 24px;
      font-size: 13.5px; border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border-med);
    }
    .md-body th {
      background: var(--surface-2); color: var(--text); font-weight: 700;
      padding: 10px 14px; text-align: left; font-size: 12px;
      letter-spacing: .03em; border-bottom: 1px solid var(--border-med);
    }
    .md-body td {
      padding: 9px 14px; border-bottom: 1px solid var(--border);
      color: #CBD5E1; vertical-align: top; line-height: 1.5;
    }
    .md-body tr:last-child td { border-bottom: none; }
    .md-body tr:hover td { background: rgba(148,163,184,.04); }

    /* Code */
    .md-body code {
      background: rgba(13,148,136,.12); color: #6EE7B7;
      padding: 2px 7px; border-radius: 5px; font-size: 13px;
      font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace;
      border: 1px solid rgba(13,148,136,.2);
    }
    .md-body pre {
      background: var(--surface); border: 1px solid var(--border-med);
      border-radius: 10px; padding: 16px; overflow-x: auto; margin: 16px 0;
    }
    .md-body pre code {
      background: none; border: none; padding: 0;
      color: #CBD5E1; font-size: 13px; line-height: 1.6;
    }

    /* Blockquotes — Teacher notes */
    .md-body blockquote {
      margin: 16px 0; padding: 12px 16px 12px 16px;
      background: rgba(13,148,136,.07);
      border-left: 3px solid var(--primary);
      border-radius: 0 8px 8px 0;
    }
    .md-body blockquote p {
      margin: 0; color: #A7F3D0; font-size: 14px;
    }

    /* Lists */
    .md-body ul, .md-body ol {
      margin: 8px 0 16px; padding-left: 24px;
    }
    .md-body li {
      margin-bottom: 5px; color: #CBD5E1; line-height: 1.65;
    }
    .md-body li strong { color: var(--text); }

    /* Horizontal rule */
    .md-body hr {
      border: none; border-top: 1px solid var(--border); margin: 32px 0;
    }

    /* ── Empty/Loading state ── */
    .loading-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 80px 20px; text-align: center;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--surface-2);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Sidebar overlay (mobile) ── */
    #sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
      z-index: 40; opacity: 0; transition: opacity .25s;
    }
    #sidebar-overlay.open { opacity: 1; }

    /* ── Scroll to top button ── */
    #btn-top {
      position: fixed; bottom: 24px; right: 24px;
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--surface-2); border: 1px solid var(--border-med);
      color: var(--muted); cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s, color .15s;
      z-index: 30;
    }
    #btn-top.visible { opacity: 1; pointer-events: all; }
    #btn-top:hover { color: var(--text); transform: translateY(-2px); }
    #btn-top svg { width: 16px; height: 16px; }

    /* ── Mobile / Responsive ── */
    @media (max-width: 768px) {
      :root { --sidebar-w: 0px; }

      .sidebar {
        width: 288px;
        transform: translateX(-100%);
        z-index: 60;
        box-shadow: 8px 0 32px rgba(0,0,0,.4);
      }
      .sidebar.open { transform: translateX(0); }

      #sidebar-overlay { display: block; }

      #btn-sidebar-toggle { display: flex; }
      #current-chapter-label { display: block; }

      .main-content {
        margin-left: 0; padding: 24px 16px 80px;
      }

      .ch-banner { padding: 20px; }
      .ch-banner-title { font-size: 18px; }

      .md-body { font-size: 14px; }
      .md-body h2 { font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Reading progress bar -->
  <div id="progress-bar" role="progressbar" aria-label="Tiến trình đọc" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>

  <!-- Header -->
  <header>
    <button id="btn-back" onclick="goBack()" aria-label="Về trang chủ ISTQB">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Trang chủ
    </button>

    <div>
      <div class="header-title">ISTQB CTFL v4.0.1</div>
      <div class="header-sub">Ôn tập kiến thức</div>
    </div>

    <div class="header-spacer"></div>

    <span id="current-chapter-label" aria-live="polite"></span>

    <button id="btn-sidebar-toggle" onclick="toggleSidebar()" aria-label="Mở/đóng danh sách chương">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </header>

  <!-- Sidebar overlay (mobile) -->
  <div id="sidebar-overlay" onclick="closeSidebar()" aria-hidden="true"></div>

  <!-- App layout -->
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Danh sách chương">

      <!-- Chapter navigation -->
      <div class="sidebar-section">
        <div class="sidebar-section-label">CÁC CHƯƠNG</div>
        <nav id="chapter-nav" aria-label="Chương ôn tập"></nav>
      </div>

      <div class="sidebar-divider"></div>

      <!-- Table of contents -->
      <div class="sidebar-section" id="toc-section" style="flex:1; overflow-y:auto;">
        <div class="sidebar-section-label">MỤC LỤC</div>
        <nav id="toc-nav" aria-label="Mục lục chương hiện tại">
          <ul class="toc-list" id="toc-list"></ul>
        </nav>
      </div>

    </aside>

    <!-- Main content area -->
    <main class="main-content" id="main-content" role="main">
      <div class="content-inner">

        <!-- Chapter banner -->
        <div class="ch-banner" id="ch-banner"></div>

        <!-- Markdown content -->
        <article class="md-body" id="md-body">
          <div class="loading-state">
            <div class="spinner"></div>
            <p style="color:var(--muted); font-size:14px;">Đang tải nội dung...</p>
          </div>
        </article>

      </div>
    </main>

  </div>

  <!-- Scroll to top -->
  <button id="btn-top" onclick="scrollToTop()" aria-label="Cuộn lên đầu trang">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <!-- Data & marked.js -->
  <script src="ctfl-review-data.js"></script>
  <script>
  (function () {
    'use strict';

    // ── Config ──────────────────────────────────────────────────────────────
    const STORAGE_KEY = 'ctfl_review_read';

    // ── State ────────────────────────────────────────────────────────────────
    let activeId = 1;
    let readSet  = new Set();
    let tocObserver = null;

    // ── localStorage helpers ─────────────────────────────────────────────────
    function loadRead() {
      try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
      catch { return new Set(); }
    }
    function saveRead() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...readSet]));
    }

    // ── Go back ──────────────────────────────────────────────────────────────
    function goBack() {
      // Go back or to ISTQB Foundation index
      if (document.referrer && document.referrer.includes('index.html')) {
        history.back();
      } else {
        window.location.href = 'index.html';
      }
    }
    window.goBack = goBack;

    // ── Sidebar toggle (mobile) ───────────────────────────────────────────────
    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebar-overlay');
      const open = sb.classList.toggle('open');
      ov.classList.toggle('open', open);
      if (open) ov.style.pointerEvents = 'all';
      else ov.style.pointerEvents = 'none';
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      const ov = document.getElementById('sidebar-overlay');
      ov.classList.remove('open');
      ov.style.pointerEvents = 'none';
    }
    window.toggleSidebar = toggleSidebar;
    window.closeSidebar  = closeSidebar;

    // ── Scroll to top ────────────────────────────────────────────────────────
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    window.scrollToTop = scrollToTop;

    // ── Build chapter nav ────────────────────────────────────────────────────
    function buildChapterNav() {
      const nav = document.getElementById('chapter-nav');
      nav.innerHTML = '';

      CTFL_REVIEW_DATA.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'ch-item' + (ch.id === activeId ? ' active' : '');
        btn.setAttribute('aria-current', ch.id === activeId ? 'page' : 'false');
        btn.onclick = () => { loadChapter(ch.id); closeSidebar(); };

        const isRead = readSet.has(ch.id);
        const dotBg  = ch.color + '22';
        const dotBor = ch.color + '44';

        btn.innerHTML = `
          <div class="ch-dot" style="background:${dotBg};border:1.5px solid ${dotBor};color:${ch.color};">${ch.id}</div>
          <div class="ch-info">
            <div class="ch-num" style="color:${ch.color};">CHƯƠNG ${ch.id}</div>
            <div class="ch-title-short">${ch.titleVi}</div>
            <div class="ch-meta">
              <span class="ch-badge">${ch.time} phút</span>
              <span class="ch-badge weight">${ch.weight}</span>
            </div>
          </div>
          <div class="ch-read-mark${isRead ? ' done' : ''}" title="${isRead ? 'Đã đọc' : 'Chưa đọc'}">
            ${isRead ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
          </div>
        `;
        nav.appendChild(btn);
      });
    }

    // ── Build chapter banner ─────────────────────────────────────────────────
    function buildBanner(ch) {
      const banner = document.getElementById('ch-banner');
      banner.style.background = `linear-gradient(135deg, ${ch.color}dd 0%, ${ch.color}99 50%, ${ch.color}55 100%)`;
      banner.innerHTML = `
        <div class="ch-banner-num">CHƯƠNG ${ch.id} — ISTQB CTFL v4.0.1</div>
        <div class="ch-banner-title">${ch.titleEn}</div>
        <div class="ch-banner-sub">${ch.titleVi}</div>
        <div class="ch-banner-stats">
          <div class="ch-stat">${ch.time} phút<span>Thời lượng</span></div>
          <div class="ch-stat">${ch.weight}<span>Trọng số</span></div>
          ${readSet.has(ch.id) ? '<div class="ch-stat" style="background:rgba(16,185,129,.25);">Đã đọc<span>Trạng thái</span></div>' : ''}
        </div>
      `;
    }

    // ── Slugify for heading IDs ──────────────────────────────────────────────
    function slugify(text) {
      return text
        .toLowerCase()
        .replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g, 'a')
        .replace(/[èéẹẻẽêềếệểễ]/g, 'e')
        .replace(/[ìíịỉĩ]/g, 'i')
        .replace(/[òóọỏõôồốộổỗơờớợởỡ]/g, 'o')
        .replace(/[ùúụủũưừứựửữ]/g, 'u')
        .replace(/[ỳýỵỷỹ]/g, 'y')
        .replace(/đ/g, 'd')
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    }

    // ── Build TOC from rendered headings ────────────────────────────────────
    function buildTOC() {
      const body     = document.getElementById('md-body');
      const tocList  = document.getElementById('toc-list');
      tocList.innerHTML = '';

      const headings = body.querySelectorAll('h2, h3');
      const items    = [];

      headings.forEach((el, idx) => {
        // Skip the Mục lục h2
        if (el.textContent.trim().toLowerCase() === 'mục lục') {
          el.style.display = 'none';
          // Also hide the next ol (the TOC list from markdown)
          if (el.nextElementSibling && el.nextElementSibling.tagName === 'OL') {
            el.nextElementSibling.style.display = 'none';
          }
          return;
        }

        const id = 'heading-' + idx + '-' + slugify(el.textContent.replace(/[⭐★✓✗]/g, '').trim());
        el.id = id;

        const btn = document.createElement('button');
        btn.className = 'toc-item' + (el.tagName === 'H3' ? ' h3' : '');
        btn.textContent = el.textContent.replace(/^#+\s*/, '').trim();
        btn.dataset.target = id;
        btn.onclick = () => {
          scrollToHeading(id);
          closeSidebar();
        };
        tocList.appendChild(btn);
        items.push({ id, el: btn });
      });

      // Setup IntersectionObserver for active TOC highlighting
      setupTocObserver(headings, items);
    }

    function scrollToHeading(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── IntersectionObserver for TOC ─────────────────────────────────────────
    function setupTocObserver(headings, tocItems) {
      if (tocObserver) tocObserver.disconnect();

      tocObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.id;
            tocItems.forEach(t => {
              const isActive = t.id === id;
              t.el.classList.toggle('active', isActive);
              if (isActive) t.el.scrollIntoView({ block: 'nearest' });
            });
          }
        });
      }, {
        rootMargin: '-60px 0px -60% 0px',
        threshold: 0,
      });

      headings.forEach(h => { if (h.id) tocObserver.observe(h); });
    }

    // ── Reading progress bar ─────────────────────────────────────────────────
    function setupProgressBar() {
      const bar = document.getElementById('progress-bar');

      function update() {
        const scrollTop  = window.scrollY;
        const docHeight  = document.documentElement.scrollHeight - window.innerHeight;
        const pct        = docHeight > 0 ? Math.round((scrollTop / docHeight) * 100) : 0;
        bar.style.width  = pct + '%';
        bar.setAttribute('aria-valuenow', pct);

        // Mark as read when near bottom
        if (pct >= 92 && !readSet.has(activeId)) {
          readSet.add(activeId);
          saveRead();
          buildChapterNav();
          buildBanner(CTFL_REVIEW_DATA.find(c => c.id === activeId));
        }

        // Show/hide scroll-to-top button
        const btn = document.getElementById('btn-top');
        if (scrollTop > 400) btn.classList.add('visible');
        else btn.classList.remove('visible');
      }

      window.addEventListener('scroll', update, { passive: true });
      update();
    }

    // ── Load chapter ─────────────────────────────────────────────────────────
    function loadChapter(id) {
      const ch = CTFL_REVIEW_DATA.find(c => c.id === id);
      if (!ch) return;

      activeId = id;

      // Update header label
      document.getElementById('current-chapter-label').textContent = `Ch.${id} — ${ch.titleVi}`;

      // Update document title
      document.title = `Ch.${id} ${ch.titleVi} — CTFL Ôn Tập`;

      // Render markdown
      const mdBody = document.getElementById('md-body');
      mdBody.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';

      // Use requestAnimationFrame to not block the UI
      requestAnimationFrame(() => {
        const html = marked.parse(ch.content, {
          gfm: true,
          breaks: false,
        });
        mdBody.innerHTML = html;

        // Build banner + sidebar
        buildBanner(ch);
        buildChapterNav();
        buildTOC();

        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'instant' });
      });
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    function init() {
      // Load read progress
      readSet = loadRead();

      // Check URL param for chapter id
      const params = new URLSearchParams(window.location.search);
      const chParam = parseInt(params.get('ch'), 10);
      if (chParam >= 1 && chParam <= 6) activeId = chParam;

      // Build sidebar nav
      buildChapterNav();

      // Load first chapter
      loadChapter(activeId);

      // Setup progress bar
      setupProgressBar();
    }

    // Wait for both DOM + data script to be ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  }());
  </script>
</body>
