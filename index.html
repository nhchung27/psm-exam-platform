<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Certification Exam Platform — PSM & ISTQB CTFL study platform">
  <title>Certification Exam Platform</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0F172A;
      --surface: #1E293B;
      --surface-2: #334155;
      --text: #F1F5F9;
      --muted: #94A3B8;
      --border: rgba(148,163,184,.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(13,148,136,.08) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(124,58,237,.06) 0%, transparent 55%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 520px; width: 100%; text-align: center; }

    .logo {
      font-size: 36px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      text-decoration: none;
      color: var(--text);
      transition: transform .2s, box-shadow .2s, border-color .2s;
      text-align: left;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }

    .card-inner {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .card-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .card-body { flex: 1; }

    .card-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
    }

    .card-arrow {
      font-size: 18px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 8px;
    }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🎓</div>
    <h1>Certification Prep</h1>
    <p class="subtitle">Chọn chứng chỉ bạn muốn ôn tập</p>

    <div class="cards">
      <!-- ISTQB Foundation -->
      <a href="ISTQB Foundation/index.html" class="card" style="border-color: rgba(13,148,136,.3);" onmouseover="this.style.borderColor='rgba(13,148,136,.6)'" onmouseout="this.style.borderColor='rgba(13,148,136,.3)'">
        <div class="card-inner">
          <div class="card-icon" style="background: rgba(13,148,136,.15); border: 1.5px solid rgba(13,148,136,.3);">📋</div>
          <div class="card-body">
            <div class="card-label" style="color: #0D9488;">ISTQB</div>
            <div class="card-title">CTFL Foundation Level</div>
            <div class="card-desc">v4.0.1 — 6 chương, 41 câu hỏi, flashcard từ khóa</div>
            <span class="badge" style="background: rgba(13,148,136,.15); color: #0D9488;">MỚI</span>
          </div>
          <div class="card-arrow">→</div>
        </div>
      </a>

      <!-- PSM Certification -->
      <a href="PSM Certification/index.html" class="card" style="border-color: rgba(124,58,237,.3);" onmouseover="this.style.borderColor='rgba(124,58,237,.6)'" onmouseout="this.style.borderColor='rgba(124,58,237,.3)'">
        <div class="card-inner">
          <div class="card-icon" style="background: rgba(124,58,237,.12); border: 1.5px solid rgba(124,58,237,.3);">🏆</div>
          <div class="card-body">
            <div class="card-label" style="color: #7C3AED;">SCRUM.ORG</div>
            <div class="card-title">PSM I & II</div>
            <div class="card-desc">Professional Scrum Master — Mock exam platform</div>
          </div>
          <div class="card-arrow">→</div>
        </div>
      </a>
    </div>

    <p class="footer">Tài liệu dựa trên ISTQB CTFL Syllabus v4.0.1 &amp; Scrum.org PSM curriculum</p>
  </div>
</body>
</html>
